<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>General Calculator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="theme.css">
</head>

<body>
    <section class="calculator" aria-label="General calculator">
        <div class="calculator__header">
            <h1 class="calculator__title">General Calculator</h1>
            <p class="calculator__subtitle">Enter expressions with +, -, �, �, %, and parentheses.</p>
        </div>

        <div class="display" aria-live="polite">
            <div class="display__previous" id="previous-expression"></div>
            <div class="display__current" id="current-expression">0</div>
        </div>

        <div class="buttons">
            <button class="button button--danger" type="button" data-action="clear">C</button>
            <button class="button button--danger" type="button" data-action="delete">DEL</button>
            <button class="button" type="button" data-value="%">%</button>
            <button class="button button--accent" type="button" data-value="/">/</button>

            <button class="button" type="button" data-value="7">7</button>
            <button class="button" type="button" data-value="8">8</button>
            <button class="button" type="button" data-value="9">9</button>
            <button class="button button--accent" type="button" data-value="*">*</button>

            <button class="button" type="button" data-value="4">4</button>
            <button class="button" type="button" data-value="5">5</button>
            <button class="button" type="button" data-value="6">6</button>
            <button class="button button--accent" type="button" data-value="-">-</button>

            <button class="button" type="button" data-value="1">1</button>
            <button class="button" type="button" data-value="2">2</button>
            <button class="button" type="button" data-value="3">3</button>
            <button class="button button--accent" type="button" data-value="+">+</button>

            <button class="button button--wide" type="button" data-value="0">0</button>
            <button class="button" type="button" data-value=".">.</button>
            <button class="button button--accent button--wide" type="button" data-action="equals">=</button>
        </div>

        <div class="calculator__footer">
            <span>Fast. Accurate. Easy.</span>
        </div>
    </section>

    <script>
        const previousExpression = document.getElementById('previous-expression');
        const currentExpression = document.getElementById('current-expression');
        let expression = '';
        let evaluated = false;

        function updateDisplay() {
            currentExpression.textContent = expression || '0';
        }

        function applyValue(value) {
            if (evaluated && !['+', '-', '*', '/', '%', ')'].includes(value)) {
                expression = value;
                evaluated = false;
            } else {
                if (evaluated && ['+', '-', '*', '/', '%', '('].includes(value)) {
                    evaluated = false;
                }
                expression += value;
            }
            updateDisplay();
        }

        function clearAll() {
            expression = '';
            previousExpression.textContent = '';
            evaluated = false;
            updateDisplay();
        }

        function deleteLast() {
            expression = expression.slice(0, -1);
            updateDisplay();
        }

        function formatExpression(expr) {
            return expr.replace(/\*/g, '�').replace(/\//g, '�');
        }

        function isValidExpression(expr) {
            // Allow digits, operators, parentheses, decimal and percent
            return /^[-+*/%().\d\s]*$/.test(expr);
        }

        function evaluateExpression() {
            if (!expression) return;
            const safeExpression = expression.replace(/�/g, '/').replace(/�/g, '*');
            if (!isValidExpression(safeExpression)) {
                currentExpression.textContent = 'Error';
                return;
            }
            try {
                const result = Function(`"use strict"; return (${safeExpression})`)();
                previousExpression.textContent = `${formatExpression(expression)} =`;
                expression = Number.isFinite(result) ? String(result) : 'Error';
                evaluated = true;
                updateDisplay();
            } catch {
                currentExpression.textContent = 'Error';
                expression = '';
                evaluated = false;
            }
        }

        document.querySelectorAll('.button').forEach(button => {
            button.addEventListener('click', () => {
                const value = button.dataset.value;
                const action = button.dataset.action;

                if (action === 'clear') {
                    clearAll();
                    return;
                }

                if (action === 'delete') {
                    deleteLast();
                    return;
                }

                if (action === 'equals') {
                    evaluateExpression();
                    return;
                }

                if (value) {
                    applyValue(value);
                }
            });
        });

        window.addEventListener('keydown', event => {
            const key = event.key;
            const allowed = '0123456789.+-*/%()';

            if (allowed.includes(key)) {
                event.preventDefault();
                let value = key;
                if (key === '*') value = '*';
                if (key === '/') value = '/';
                applyValue(value);
            }

            if (key === 'Enter' || key === '=') {
                event.preventDefault();
                evaluateExpression();
            }

            if (key === 'Backspace') {
                event.preventDefault();
                deleteLast();
            }

            if (key.toLowerCase() === 'c') {
                event.preventDefault();
                clearAll();
            }
        });

        updateDisplay();
    </script>
</body>

</html>
