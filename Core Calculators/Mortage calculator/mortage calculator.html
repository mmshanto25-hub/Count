<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mortage Calculator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="theme.css">
</head>

<body>
    <main class="page">
        <section class="hero">
            <h1>Mortage Calculator</h1>
            <p>Quickly estimate your monthly payment, total interest, and total payment for a fixed-rate mortgage loan.
            </p>
        </section>

        <section class="calculator" aria-label="Mortgage calculator">
            <div class="form-grid">
                <div class="field">
                    <label for="loan-amount">Loan amount</label>
                    <input id="loan-amount" type="number" min="0" step="100" placeholder="e.g. 250000"
                        aria-describedby="loan-help">
                    <p class="note" id="loan-help">Enter the total amount you want to borrow.</p>
                </div>

                <div class="field">
                    <label for="interest-rate">Annual interest rate (%)</label>
                    <input id="interest-rate" type="number" min="0" step="0.01" placeholder="e.g. 4.25">
                </div>

                <div class="field">
                    <label for="loan-term">Loan term (years)</label>
                    <input id="loan-term" type="number" min="1" step="1" placeholder="e.g. 30">
                </div>

                <div class="field">
                    <label for="payment-frequency">Payment frequency</label>
                    <select id="payment-frequency">
                        <option value="12">Monthly</option>
                        <option value="26">Biweekly</option>
                        <option value="52">Weekly</option>
                    </select>
                </div>
            </div>

            <div class="actions">
                <button class="button" id="calculate-button" type="button">Calculate Payment</button>
                <button class="button button--secondary" id="reset-button" type="button">Reset fields</button>
            </div>

            <div class="results" aria-live="polite">
                <div class="result-item">
                    <div class="result-label">Payment per period</div>
                    <div class="result-value" id="payment-result">$0.00</div>
                </div>
                <div class="result-item">
                    <div class="result-label">Total of payments</div>
                    <div class="result-value" id="total-result">$0.00</div>
                </div>
                <div class="result-item">
                    <div class="result-label">Total interest</div>
                    <div class="result-value" id="interest-result">$0.00</div>
                </div>
            </div>
        </section>

        <div class="page-footer">
            <span>Use a fixed-rate estimation for planning your mortgage.</span>
        </div>
    </main>
    <script src="script.js"></script>

</body>

</html>
