<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="theme.css">
</head>

<body>
    <div class="container">
        <div class="hero">
            <h1>BMI Calculator</h1>
            <p>Quickly calculate your body mass index and see whether you are underweight, healthy, overweight or obese.
            </p>
        </div>

        <div class="card">
            <div class="row">
                <div>
                    <label for="weight">Weight</label>
                    <input id="weight" type="number" min="1" step="0.1" placeholder="Kilograms" />
                </div>
                <div>
                    <label for="height">Height</label>
                    <input id="height" type="number" min="30" step="0.1" placeholder="Centimeters" />
                </div>
            </div>

            <div class="row">
                <div>
                    <label for="age">Age</label>
                    <input id="age" type="number" min="1" step="1" placeholder="Years" />
                </div>
                <div>
                    <label for="gender">Gender</label>
                    <select id="gender">
                        <option value="other">Prefer not to say</option>
                        <option value="female">Female</option>
                        <option value="male">Male</option>
                    </select>
                </div>
            </div>

            <div class="actions">
                <button class="button" type="button" id="calculate">Calculate BMI</button>
                <button class="button button--reset" type="button" id="reset">Reset</button>
            </div>

            <div class="result" aria-live="polite">
                <p class="result__value" id="bmi-value">0.0</p>
                <p class="result__label" id="bmi-label">Enter your details and calculate your BMI.</p>
                <div class="result__score" id="bmi-range">Healthy BMI is between 18.5 and 24.9</div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
