<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pressure Converter</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="theme.css">
</head>

<body>
    <div class="container">
        <div class="hero">
            <h1>Pressure Converter</h1>
            <p>Convert pressure units such as pascal, bar, psi, and atmosphere.</p>
        </div>

        <div class="card">
            <div class="row">
                <div>
                    <label for="input-value">Value</label>
                    <input id="input-value" type="number" step="0.01" placeholder="Enter pressure" />
                </div>
                <div>
                    <label for="from-unit">From unit</label>
                    <select id="from-unit">
                        <option value="pascal">Pascal (Pa)</option>
                        <option value="bar">Bar</option>
                        <option value="psi">PSI</option>
                        <option value="atm">Atmosphere (atm)</option>
                    </select>
                </div>
            </div>

            <div class="row">
                <div>
                    <label for="to-unit">To unit</label>
                    <select id="to-unit">
                        <option value="pascal">Pascal (Pa)</option>
                        <option value="bar">Bar</option>
                        <option value="psi">PSI</option>
                        <option value="atm">Atmosphere (atm)</option>
                    </select>
                </div>
                <div>
                    <label>&nbsp;</label>
                    <div class="actions">
                        <button class="button" type="button" id="convert">Convert</button>
                        <button class="button button--reset" type="button" id="reset">Reset</button>
                    </div>
                </div>
            </div>

            <div class="result" aria-live="polite">
                <p class="result__value" id="output-value">0.00</p>
                <p class="result__label" id="output-label">Select units and convert pressure.</p>
                <div class="result__details">
                    <span id="detail-from">From: 0.00 Pa</span>
                    <span id="detail-to">To: 0.00 Pa</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const inputValue = document.getElementById('input-value');
        const fromUnit = document.getElementById('from-unit');
        const toUnit = document.getElementById('to-unit');
        const outputValue = document.getElementById('output-value');
        const outputLabel = document.getElementById('output-label');
        const detailFrom = document.getElementById('detail-from');
        const detailTo = document.getElementById('detail-to');
        const convertButton = document.getElementById('convert');
        const resetButton = document.getElementById('reset');

        function formatNumber(value) {
            return Number(value).toLocaleString('en-US', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 4,
            });
        }

        function toPascals(value, unit) {
            switch (unit) {
                case 'pascal':
                    return value;
                case 'bar':
                    return value * 100000;
                case 'psi':
                    return value * 6894.75729;
                case 'atm':
                    return value * 101325;
                default:
                    return value;
            }
        }

        function fromPascals(value, unit) {
            switch (unit) {
                case 'pascal':
                    return value;
                case 'bar':
                    return value / 100000;
                case 'psi':
                    return value / 6894.75729;
                case 'atm':
                    return value / 101325;
                default:
                    return value;
            }
        }

        function unitLabel(unit) {
            switch (unit) {
                case 'pascal':
                    return 'Pa';
                case 'bar':
                    return 'bar';
                case 'psi':
                    return 'psi';
                case 'atm':
                    return 'atm';
                default:
                    return unit;
            }
        }

        function convertPressure() {
            const input = Number(inputValue.value);
            const from = fromUnit.value;
            const to = toUnit.value;

            if (Number.isNaN(input)) {
                outputValue.textContent = 'Enter a number';
                outputLabel.textContent = 'Please type a pressure value first.';
                detailFrom.textContent = 'From: �';
                detailTo.textContent = 'To: �';
                return;
            }

            const pascals = toPascals(input, from);
            const result = fromPascals(pascals, to);

            outputValue.textContent = formatNumber(result);
            outputLabel.textContent = `${formatNumber(input)} ${unitLabel(from)} =`;
            detailFrom.textContent = `From: ${formatNumber(input)} ${unitLabel(from)}`;
            detailTo.textContent = `To: ${formatNumber(result)} ${unitLabel(to)}`;
        }

        function resetConverter() {
            inputValue.value = '';
            fromUnit.value = 'pascal';
            toUnit.value = 'bar';
            outputValue.textContent = '0.00';
            outputLabel.textContent = 'Select units and convert pressure.';
            detailFrom.textContent = 'From: 0.00 Pa';
            detailTo.textContent = 'To: 0.00 Pa';
        }

        convertButton.addEventListener('click', convertPressure);
        resetButton.addEventListener('click', resetConverter);
        inputValue.addEventListener('keydown', event => {
            if (event.key === 'Enter') {
                convertPressure();
            }
        });
    </script>
</body>

</html>
