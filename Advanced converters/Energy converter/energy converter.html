<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Energy Converter</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="theme.css">
</head>

<body>
    <div class="container">
        <div class="hero">
            <h1>Energy Converter</h1>
            <p>Convert energy units like joules, calories, BTU, and electronvolts with a sleek interface.</p>
        </div>

        <div class="card">
            <div class="row">
                <div>
                    <label for="input-value">Value</label>
                    <input id="input-value" type="number" step="0.01" placeholder="Enter energy value" />
                </div>
                <div>
                    <label for="from-unit">From unit</label>
                    <select id="from-unit">
                        <option value="joules">Joules (J)</option>
                        <option value="calories">Calories (cal)</option>
                        <option value="btu">BTU</option>
                        <option value="electronvolts">Electronvolts (eV)</option>
                    </select>
                </div>
            </div>

            <div class="row">
                <div>
                    <label for="to-unit">To unit</label>
                    <select id="to-unit">
                        <option value="joules">Joules (J)</option>
                        <option value="calories">Calories (cal)</option>
                        <option value="btu">BTU</option>
                        <option value="electronvolts">Electronvolts (eV)</option>
                    </select>
                </div>
                <div>
                    <label>&nbsp;</label>
                    <div class="actions">
                        <button class="button" type="button" id="convert">Convert</button>
                        <button class="button button--reset" type="button" id="reset">Reset</button>
                    </div>
                </div>
            </div>

            <div class="result" aria-live="polite">
                <p class="result__value" id="output-value">0.00</p>
                <p class="result__label" id="output-label">Select units and convert energy.</p>
                <div class="result__details">
                    <span id="detail-from">From: 0.00 J</span>
                    <span id="detail-to">To: 0.00 J</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const inputValue = document.getElementById('input-value');
        const fromUnit = document.getElementById('from-unit');
        const toUnit = document.getElementById('to-unit');
        const outputValue = document.getElementById('output-value');
        const outputLabel = document.getElementById('output-label');
        const detailFrom = document.getElementById('detail-from');
        const detailTo = document.getElementById('detail-to');
        const convertButton = document.getElementById('convert');
        const resetButton = document.getElementById('reset');

        function formatNumber(value) {
            return Number(value).toLocaleString('en-US', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 4,
            });
        }

        function toJoules(value, unit) {
            switch (unit) {
                case 'joules':
                    return value;
                case 'calories':
                    return value * 4.184;
                case 'btu':
                    return value * 1055.05585;
                case 'electronvolts':
                    return value * 1.602176634e-19;
                default:
                    return value;
            }
        }

        function fromJoules(value, unit) {
            switch (unit) {
                case 'joules':
                    return value;
                case 'calories':
                    return value / 4.184;
                case 'btu':
                    return value / 1055.05585;
                case 'electronvolts':
                    return value / 1.602176634e-19;
                default:
                    return value;
            }
        }

        function unitLabel(unit) {
            switch (unit) {
                case 'joules':
                    return 'J';
                case 'calories':
                    return 'cal';
                case 'btu':
                    return 'BTU';
                case 'electronvolts':
                    return 'eV';
                default:
                    return unit;
            }
        }

        function convertEnergy() {
            const input = Number(inputValue.value);
            const from = fromUnit.value;
            const to = toUnit.value;

            if (Number.isNaN(input)) {
                outputValue.textContent = 'Enter a number';
                outputLabel.textContent = 'Please type an energy value first.';
                detailFrom.textContent = 'From: �';
                detailTo.textContent = 'To: �';
                return;
            }

            const joules = toJoules(input, from);
            const result = fromJoules(joules, to);

            outputValue.textContent = formatNumber(result);
            outputLabel.textContent = `${formatNumber(input)} ${unitLabel(from)} =`;
            detailFrom.textContent = `From: ${formatNumber(input)} ${unitLabel(from)}`;
            detailTo.textContent = `To: ${formatNumber(result)} ${unitLabel(to)}`;
        }

        function resetConverter() {
            inputValue.value = '';
            fromUnit.value = 'joules';
            toUnit.value = 'calories';
            outputValue.textContent = '0.00';
            outputLabel.textContent = 'Select units and convert energy.';
            detailFrom.textContent = 'From: 0.00 J';
            detailTo.textContent = 'To: 0.00 J';
        }

        convertButton.addEventListener('click', convertEnergy);
        resetButton.addEventListener('click', resetConverter);
        inputValue.addEventListener('keydown', event => {
            if (event.key === 'Enter') {
                convertEnergy();
            }
        });
    </script>
</body>

</html>
