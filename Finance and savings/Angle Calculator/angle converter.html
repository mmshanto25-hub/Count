<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Angle Converter</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="theme.css">
</head>

<body>
    <div class="container">
        <div class="hero">
            <h1>Angle Converter</h1>
            <p>Convert between degrees, radians, grads, arcminutes, and arcseconds instantly.</p>
        </div>

        <div class="card">
            <div class="row">
                <div>
                    <label for="input-value">Value</label>
                    <input id="input-value" type="number" step="0.0001" placeholder="Enter angle value" />
                </div>
                <div>
                    <label for="from-unit">From unit</label>
                    <select id="from-unit">
                        <option value="degrees">Degrees</option>
                        <option value="radians">Radians</option>
                        <option value="grads">Grads</option>
                        <option value="arcminutes">Arcminutes</option>
                        <option value="arcseconds">Arcseconds</option>
                    </select>
                </div>
            </div>

            <div class="row">
                <div>
                    <label for="to-unit">To unit</label>
                    <select id="to-unit">
                        <option value="degrees">Degrees</option>
                        <option value="radians">Radians</option>
                        <option value="grads">Grads</option>
                        <option value="arcminutes">Arcminutes</option>
                        <option value="arcseconds">Arcseconds</option>
                    </select>
                </div>
                <div>
                    <label>&nbsp;</label>
                    <div class="actions">
                        <button class="button" type="button" id="convert">Convert</button>
                        <button class="button button--reset" type="button" id="reset">Reset</button>
                    </div>
                </div>
            </div>

            <div class="result" aria-live="polite">
                <p class="result__value" id="output-value">0.0000</p>
                <p class="result__label" id="output-label">Select units and convert an angle.</p>
                <div class="result__details">
                    <span id="detail-from">From: 0.0000 degrees</span>
                    <span id="detail-to">To: 0.0000 degrees</span>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
