<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Angle Converter</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="theme.css">
</head>

<body>
    <div class="container">
        <div class="hero">
            <h1>Angle Converter</h1>
            <p>Convert between degrees, radians, grads, arcminutes, and arcseconds instantly.</p>
        </div>

        <div class="card">
            <div class="row">
                <div>
                    <label for="input-value">Value</label>
                    <input id="input-value" type="number" step="0.0001" placeholder="Enter angle value" />
                </div>
                <div>
                    <label for="from-unit">From unit</label>
                    <select id="from-unit">
                        <option value="degrees">Degrees</option>
                        <option value="radians">Radians</option>
                        <option value="grads">Grads</option>
                        <option value="arcminutes">Arcminutes</option>
                        <option value="arcseconds">Arcseconds</option>
                    </select>
                </div>
            </div>

            <div class="row">
                <div>
                    <label for="to-unit">To unit</label>
                    <select id="to-unit">
                        <option value="degrees">Degrees</option>
                        <option value="radians">Radians</option>
                        <option value="grads">Grads</option>
                        <option value="arcminutes">Arcminutes</option>
                        <option value="arcseconds">Arcseconds</option>
                    </select>
                </div>
                <div>
                    <label>&nbsp;</label>
                    <div class="actions">
                        <button class="button" type="button" id="convert">Convert</button>
                        <button class="button button--reset" type="button" id="reset">Reset</button>
                    </div>
                </div>
            </div>

            <div class="result" aria-live="polite">
                <p class="result__value" id="output-value">0.0000</p>
                <p class="result__label" id="output-label">Select units and convert an angle.</p>
                <div class="result__details">
                    <span id="detail-from">From: 0.0000 degrees</span>
                    <span id="detail-to">To: 0.0000 degrees</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const inputValue = document.getElementById('input-value');
        const fromUnit = document.getElementById('from-unit');
        const toUnit = document.getElementById('to-unit');
        const outputValue = document.getElementById('output-value');
        const outputLabel = document.getElementById('output-label');
        const detailFrom = document.getElementById('detail-from');
        const detailTo = document.getElementById('detail-to');
        const convertButton = document.getElementById('convert');
        const resetButton = document.getElementById('reset');

        function formatNumber(value) {
            return Number(value).toLocaleString('en-US', {
                maximumFractionDigits: 6,
                minimumFractionDigits: 4,
            });
        }

        function toDegrees(value, unit) {
            switch (unit) {
                case 'degrees':
                    return value;
                case 'radians':
                    return value * (180 / Math.PI);
                case 'grads':
                    return value * 0.9;
                case 'arcminutes':
                    return value / 60;
                case 'arcseconds':
                    return value / 3600;
                default:
                    return value;
            }
        }

        function fromDegrees(value, unit) {
            switch (unit) {
                case 'degrees':
                    return value;
                case 'radians':
                    return value * (Math.PI / 180);
                case 'grads':
                    return value / 0.9;
                case 'arcminutes':
                    return value * 60;
                case 'arcseconds':
                    return value * 3600;
                default:
                    return value;
            }
        }

        function unitLabel(unit) {
            switch (unit) {
                case 'degrees':
                    return 'degrees';
                case 'radians':
                    return 'radians';
                case 'grads':
                    return 'grads';
                case 'arcminutes':
                    return 'arcminutes';
                case 'arcseconds':
                    return 'arcseconds';
                default:
                    return unit;
            }
        }

        function convertAngle() {
            const input = Number(inputValue.value);
            const from = fromUnit.value;
            const to = toUnit.value;

            if (Number.isNaN(input)) {
                outputValue.textContent = 'Enter a number';
                outputLabel.textContent = 'Please type an angle value first.';
                detailFrom.textContent = 'From: �';
                detailTo.textContent = 'To: �';
                return;
            }

            const degrees = toDegrees(input, from);
            const result = fromDegrees(degrees, to);

            outputValue.textContent = formatNumber(result);
            outputLabel.textContent = `${formatNumber(input)} ${unitLabel(from)} =`;
            detailFrom.textContent = `From: ${formatNumber(input)} ${unitLabel(from)}`;
            detailTo.textContent = `To: ${formatNumber(result)} ${unitLabel(to)}`;
        }

        function resetConverter() {
            inputValue.value = '';
            fromUnit.value = 'degrees';
            toUnit.value = 'radians';
            outputValue.textContent = '0.0000';
            outputLabel.textContent = 'Select units and convert an angle.';
            detailFrom.textContent = 'From: 0.0000 degrees';
            detailTo.textContent = 'To: 0.0000 degrees';
        }

        convertButton.addEventListener('click', convertAngle);
        resetButton.addEventListener('click', resetConverter);
        inputValue.addEventListener('keydown', event => {
            if (event.key === 'Enter') {
                convertAngle();
            }
        });
    </script>
</body>

</html>
