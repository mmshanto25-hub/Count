<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weight Converter</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="theme.css">
</head>

<body>
    <div class="container">
        <div class="hero">
            <h1>Weight Converter</h1>
            <p>Convert weight units fast and clearly with a sleek interface and instant results.</p>
        </div>

        <div class="card">
            <div class="row">
                <div>
                    <label for="input-value">Value</label>
                    <input id="input-value" type="number" min="0" step="0.01" placeholder="Enter amount" />
                </div>
                <div>
                    <label for="from-unit">From unit</label>
                    <select id="from-unit">
                        <option value="kilogram">Kilogram</option>
                        <option value="gram">Gram</option>
                        <option value="milligram">Milligram</option>
                        <option value="pound">Pound</option>
                        <option value="ounce">Ounce</option>
                        <option value="ton">Ton</option>
                        <option value="stone">Stone</option>
                    </select>
                </div>
            </div>

            <div class="row">
                <div>
                    <label for="to-unit">To unit</label>
                    <select id="to-unit">
                        <option value="kilogram">Kilogram</option>
                        <option value="gram">Gram</option>
                        <option value="milligram">Milligram</option>
                        <option value="pound">Pound</option>
                        <option value="ounce">Ounce</option>
                        <option value="ton">Ton</option>
                        <option value="stone">Stone</option>
                    </select>
                </div>
                <div>
                    <label>&nbsp;</label>
                    <div class="actions">
                        <button class="button" type="button" id="convert">Convert</button>
                        <button class="button button--reset" type="button" id="reset">Reset</button>
                    </div>
                </div>
            </div>

            <div class="result" aria-live="polite">
                <p class="result__value" id="output-value">0.00</p>
                <p class="result__label" id="output-label">Choose units and convert a value.</p>
                <div class="result__details">
                    <span id="detail-from">From: 0.00 kilogram</span>
                    <span id="detail-to">To: 0.00 kilogram</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const units = {
            kilogram: 1,
            gram: 0.001,
            milligram: 0.000001,
            pound: 0.45359237,
            ounce: 0.0283495231,
            ton: 1000,
            stone: 6.35029318,
        };

        const inputValue = document.getElementById('input-value');
        const fromUnit = document.getElementById('from-unit');
        const toUnit = document.getElementById('to-unit');
        const outputValue = document.getElementById('output-value');
        const outputLabel = document.getElementById('output-label');
        const detailFrom = document.getElementById('detail-from');
        const detailTo = document.getElementById('detail-to');
        const convertButton = document.getElementById('convert');
        const resetButton = document.getElementById('reset');

        function formatNumber(value) {
            return Number(value).toLocaleString('en-US', {
                maximumFractionDigits: 6,
                minimumFractionDigits: 2,
            });
        }

        function convertWeight() {
            const value = parseFloat(inputValue.value);
            const from = fromUnit.value;
            const to = toUnit.value;

            if (Number.isNaN(value)) {
                outputValue.textContent = '0.00';
                outputLabel.textContent = 'Please enter a numeric value to convert.';
                detailFrom.textContent = 'From: �';
                detailTo.textContent = 'To: �';
                return;
            }

            const kilograms = value * units[from];
            const converted = kilograms / units[to];

            outputValue.textContent = formatNumber(converted);
            outputLabel.textContent = `${formatNumber(value)} ${from} equals ${formatNumber(converted)} ${to}.`;
            detailFrom.textContent = `From: ${formatNumber(value)} ${from}`;
            detailTo.textContent = `To: ${formatNumber(converted)} ${to}`;
        }

        function resetForm() {
            inputValue.value = '';
            fromUnit.value = 'kilogram';
            toUnit.value = 'kilogram';
            outputValue.textContent = '0.00';
            outputLabel.textContent = 'Choose units and convert a value.';
            detailFrom.textContent = 'From: 0.00 kilogram';
            detailTo.textContent = 'To: 0.00 kilogram';
        }

        convertButton.addEventListener('click', convertWeight);
        resetButton.addEventListener('click', resetForm);

        resetForm();
    </script>
</body>

</html>
