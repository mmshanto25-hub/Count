<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Currency Converter</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="theme.css">
</head>

<body>
    <div class="container">
        <div class="hero">
            <h1>Currency Converter</h1>
            <p>Convert major currencies including USD, EUR, GBP, JPY, BDT, INR, PKR, MMK, and LKR using example rates
                for quick estimates.</p>
        </div>

        <div class="card">
            <div class="row">
                <div>
                    <label for="input-value">Amount</label>
                    <input id="input-value" type="number" step="0.01" placeholder="Enter amount" />
                </div>
                <div>
                    <label for="from-currency">From currency</label>
                    <select id="from-currency">
                        <option value="USD">USD</option>
                        <option value="EUR">EUR</option>
                        <option value="GBP">GBP</option>
                        <option value="JPY">JPY</option>
                        <option value="BDT">BDT</option>
                        <option value="INR">INR</option>
                        <option value="PKR">PKR</option>
                        <option value="MMK">MMK</option>
                        <option value="LKR">LKR</option>
                    </select>
                </div>
            </div>

            <div class="row">
                <div>
                    <label for="to-currency">To currency</label>
                    <select id="to-currency">
                        <option value="USD">USD</option>
                        <option value="EUR">EUR</option>
                        <option value="GBP">GBP</option>
                        <option value="JPY">JPY</option>
                        <option value="BDT">BDT</option>
                        <option value="INR">INR</option>
                        <option value="PKR">PKR</option>
                        <option value="MMK">MMK</option>
                        <option value="LKR">LKR</option>
                    </select>
                </div>
                <div>
                    <label>&nbsp;</label>
                    <div class="actions">
                        <button class="button" type="button" id="convert">Convert</button>
                        <button class="button button--reset" type="button" id="reset">Reset</button>
                    </div>
                </div>
            </div>

            <div class="result" aria-live="polite">
                <p class="result__value" id="output-value">0.00</p>
                <p class="result__label" id="output-label">Select currencies and convert an amount.</p>
                <div class="result__details">
                    <span id="detail-from">From: 0.00 USD</span>
                    <span id="detail-to">To: 0.00 USD</span>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
