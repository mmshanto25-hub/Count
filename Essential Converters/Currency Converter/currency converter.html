<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Currency Converter</title>
    <style>
        :root {
            --bg: #08131f;
            --panel: #101f3b;
            --surface: #16274a;
            --text: #f0f7ff;
            --muted: #8da3c5;
            --accent: #4ec7ff;
            --accent2: #3a8cff;
            --shadow: rgba(0, 0, 0, 0.4);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at top, #1b356c 0%, #08131f 70%);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .container {
            width: min(560px, 100%);
            background: linear-gradient(180deg, #152957 0%, #101f3b 100%);
            border-radius: 28px;
            box-shadow: 0 30px 78px var(--shadow);
            overflow: hidden;
        }

        .hero {
            padding: 28px 32px 20px;
        }

        .hero h1 {
            margin: 0;
            font-size: 2rem;
            letter-spacing: 0.02em;
        }

        .hero p {
            margin: 12px 0 0;
            color: var(--muted);
            font-size: 1rem;
            line-height: 1.55;
        }

        .card {
            background: #111f3b;
            padding: 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: var(--muted);
            font-size: 0.95rem;
        }

        input,
        select {
            width: 100%;
            padding: 16px 14px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: #15264a;
            color: var(--text);
            font-size: 1rem;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: rgba(78, 199, 255, 0.85);
            box-shadow: 0 0 0 4px rgba(78, 199, 255, 0.14);
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            margin-bottom: 18px;
        }

        .button {
            flex: 1 1 150px;
            min-width: 140px;
            border: none;
            border-radius: 18px;
            padding: 16px 24px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            color: var(--text);
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            box-shadow: 0 14px 26px rgba(62, 140, 255, 0.2);
        }

        .button:hover {
            transform: translateY(-1px);
            box-shadow: 0 16px 30px rgba(62, 140, 255, 0.28);
        }

        .button--reset {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text);
            box-shadow: none;
        }

        .result {
            padding: 22px 20px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .result__value {
            margin: 0;
            font-size: 2.8rem;
            letter-spacing: 0.02em;
        }

        .result__label {
            margin: 10px 0 0;
            color: var(--muted);
            font-size: 1rem;
            line-height: 1.5;
        }

        .result__details {
            margin-top: 16px;
            display: grid;
            gap: 10px;
            color: var(--text);
            font-size: 0.98rem;
        }

        .result__details span {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.06);
        }

        @media (max-width: 520px) {
            .row {
                grid-template-columns: 1fr;
            }

            .button {
                flex: 1 1 100%;
            }
        }
    </style>    <link rel="stylesheet" href="theme.css">
</head>
<body>
    <div class="container">
        <div class="hero">
            <h1>Currency Converter</h1>
            <p>Convert major currencies including USD, EUR, GBP, JPY, BDT, INR, PKR, MMK, and LKR using example rates for quick estimates.</p>
        </div>

        <div class="card">
            <div class="row">
                <div>
                    <label for="input-value">Amount</label>
                    <input id="input-value" type="number" step="0.01" placeholder="Enter amount" />
                </div>
                <div>
                    <label for="from-currency">From currency</label>
                    <select id="from-currency">
                        <option value="USD">USD</option>
                        <option value="EUR">EUR</option>
                        <option value="GBP">GBP</option>
                        <option value="JPY">JPY</option>
                        <option value="BDT">BDT</option>
                        <option value="INR">INR</option>
                        <option value="PKR">PKR</option>
                        <option value="MMK">MMK</option>
                        <option value="LKR">LKR</option>
                    </select>
                </div>
            </div>

            <div class="row">
                <div>
                    <label for="to-currency">To currency</label>
                    <select id="to-currency">
                        <option value="USD">USD</option>
                        <option value="EUR">EUR</option>
                        <option value="GBP">GBP</option>
                        <option value="JPY">JPY</option>
                        <option value="BDT">BDT</option>
                        <option value="INR">INR</option>
                        <option value="PKR">PKR</option>
                        <option value="MMK">MMK</option>
                        <option value="LKR">LKR</option>
                    </select>
                </div>
                <div>
                    <label>&nbsp;</label>
                    <div class="actions">
                        <button class="button" type="button" id="convert">Convert</button>
                        <button class="button button--reset" type="button" id="reset">Reset</button>
                    </div>
                </div>
            </div>

            <div class="result" aria-live="polite">
                <p class="result__value" id="output-value">0.00</p>
                <p class="result__label" id="output-label">Select currencies and convert an amount.</p>
                <div class="result__details">
                    <span id="detail-from">From: 0.00 USD</span>
                    <span id="detail-to">To: 0.00 USD</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const inputValue = document.getElementById('input-value');
        const fromCurrency = document.getElementById('from-currency');
        const toCurrency = document.getElementById('to-currency');
        const outputValue = document.getElementById('output-value');
        const outputLabel = document.getElementById('output-label');
        const detailFrom = document.getElementById('detail-from');
        const detailTo = document.getElementById('detail-to');
        const convertButton = document.getElementById('convert');
        const resetButton = document.getElementById('reset');

        const rates = {
            USD: 1,
            EUR: 0.92,
            GBP: 0.80,
            JPY: 152.50,
            BDT: 109.50,
            INR: 83.40,
            PKR: 284.20,
            MMK: 2095.00,
            LKR: 332.00,
        };

        function formatCurrency(value, currency) {
            const options = {
                style: 'currency',
                currency,
                minimumFractionDigits: 2,
                maximumFractionDigits: 2,
            };
            return Number(value).toLocaleString('en-US', options);
        }

        function convertCurrency() {
            const amount = Number(inputValue.value);
            const from = fromCurrency.value;
            const to = toCurrency.value;

            if (Number.isNaN(amount)) {
                outputValue.textContent = 'Enter a valid amount';
                outputLabel.textContent = 'Please type a number first.';
                detailFrom.textContent = 'From: �';
                detailTo.textContent = 'To: �';
                return;
            }

            const amountInUsd = amount / rates[from];
            const converted = amountInUsd * rates[to];

            outputValue.textContent = formatCurrency(converted, to);
            outputLabel.textContent = `${formatCurrency(amount, from)} =`;
            detailFrom.textContent = `From: ${formatCurrency(amount, from)}`;
            detailTo.textContent = `To: ${formatCurrency(converted, to)}`;
        }

        function resetConverter() {
            inputValue.value = '';
            fromCurrency.value = 'USD';
            toCurrency.value = 'EUR';
            outputValue.textContent = '0.00';
            outputLabel.textContent = 'Select currencies and convert an amount.';
            detailFrom.textContent = 'From: 0.00 USD';
            detailTo.textContent = 'To: 0.00 USD';
        }

        convertButton.addEventListener('click', convertCurrency);
        resetButton.addEventListener('click', resetConverter);
        inputValue.addEventListener('keydown', event => {
            if (event.key === 'Enter') {
                convertCurrency();
            }
        });
    </script>
</body>
</html>
