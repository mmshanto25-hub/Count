<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Length Converter</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="theme.css">
</head>

<body>
    <div class="container">
        <div class="hero">
            <h1>Length Converter</h1>
            <p>Convert between meters, kilometers, miles, yards, and feet easily.</p>
        </div>

        <div class="card">
            <div class="row">
                <div>
                    <label for="input-value">Value</label>
                    <input id="input-value" type="number" step="0.01" placeholder="Enter length value" />
                </div>
                <div>
                    <label for="from-unit">From unit</label>
                    <select id="from-unit">
                        <option value="meters">Meters</option>
                        <option value="kilometers">Kilometers</option>
                        <option value="miles">Miles</option>
                        <option value="yards">Yards</option>
                        <option value="feet">Feet</option>
                    </select>
                </div>
            </div>

            <div class="row">
                <div>
                    <label for="to-unit">To unit</label>
                    <select id="to-unit">
                        <option value="meters">Meters</option>
                        <option value="kilometers">Kilometers</option>
                        <option value="miles">Miles</option>
                        <option value="yards">Yards</option>
                        <option value="feet">Feet</option>
                    </select>
                </div>
                <div>
                    <label>&nbsp;</label>
                    <div class="actions">
                        <button class="button" type="button" id="convert">Convert</button>
                        <button class="button button--reset" type="button" id="reset">Reset</button>
                    </div>
                </div>
            </div>

            <div class="result" aria-live="polite">
                <p class="result__value" id="output-value">0.00</p>
                <p class="result__label" id="output-label">Select units and convert length.</p>
                <div class="result__details">
                    <span id="detail-from">From: 0.00 meters</span>
                    <span id="detail-to">To: 0.00 meters</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const inputValue = document.getElementById('input-value');
        const fromUnit = document.getElementById('from-unit');
        const toUnit = document.getElementById('to-unit');
        const outputValue = document.getElementById('output-value');
        const outputLabel = document.getElementById('output-label');
        const detailFrom = document.getElementById('detail-from');
        const detailTo = document.getElementById('detail-to');
        const convertButton = document.getElementById('convert');
        const resetButton = document.getElementById('reset');

        function formatNumber(value) {
            return Number(value).toLocaleString('en-US', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 4,
            });
        }

        function toMeters(value, unit) {
            switch (unit) {
                case 'meters':
                    return value;
                case 'kilometers':
                    return value * 1000;
                case 'miles':
                    return value * 1609.344;
                case 'yards':
                    return value * 0.9144;
                case 'feet':
                    return value * 0.3048;
                default:
                    return value;
            }
        }

        function fromMeters(value, unit) {
            switch (unit) {
                case 'meters':
                    return value;
                case 'kilometers':
                    return value / 1000;
                case 'miles':
                    return value / 1609.344;
                case 'yards':
                    return value / 0.9144;
                case 'feet':
                    return value / 0.3048;
                default:
                    return value;
            }
        }

        function unitLabel(unit) {
            switch (unit) {
                case 'meters':
                    return 'meters';
                case 'kilometers':
                    return 'kilometers';
                case 'miles':
                    return 'miles';
                case 'yards':
                    return 'yards';
                case 'feet':
                    return 'feet';
                default:
                    return unit;
            }
        }

        function convertLength() {
            const input = Number(inputValue.value);
            const from = fromUnit.value;
            const to = toUnit.value;

            if (Number.isNaN(input)) {
                outputValue.textContent = 'Enter a number';
                outputLabel.textContent = 'Please type a length value first.';
                detailFrom.textContent = 'From: �';
                detailTo.textContent = 'To: �';
                return;
            }

            const meters = toMeters(input, from);
            const result = fromMeters(meters, to);

            outputValue.textContent = formatNumber(result);
            outputLabel.textContent = `${formatNumber(input)} ${unitLabel(from)} =`;
            detailFrom.textContent = `From: ${formatNumber(input)} ${unitLabel(from)}`;
            detailTo.textContent = `To: ${formatNumber(result)} ${unitLabel(to)}`;
        }

        function resetConverter() {
            inputValue.value = '';
            fromUnit.value = 'meters';
            toUnit.value = 'kilometers';
            outputValue.textContent = '0.00';
            outputLabel.textContent = 'Select units and convert length.';
            detailFrom.textContent = 'From: 0.00 meters';
            detailTo.textContent = 'To: 0.00 meters';
        }

        convertButton.addEventListener('click', convertLength);
        resetButton.addEventListener('click', resetConverter);
        inputValue.addEventListener('keydown', event => {
            if (event.key === 'Enter') {
                convertLength();
            }
        });
    </script>
</body>

</html>
