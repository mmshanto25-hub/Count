<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Area Converter</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="theme.css">
</head>

<body>
    <div class="container">
        <div class="hero">
            <h1>Area Converter</h1>
            <p>Convert common area units like square meters, square feet, acres, and hectares instantly.</p>
        </div>

        <div class="card">
            <div class="row">
                <div>
                    <label for="input-value">Value</label>
                    <input id="input-value" type="number" step="0.01" placeholder="Enter area value" />
                </div>
                <div>
                    <label for="from-unit">From unit</label>
                    <select id="from-unit">
                        <option value="square_meters">Square meters</option>
                        <option value="square_feet">Square feet</option>
                        <option value="square_yards">Square yards</option>
                        <option value="acres">Acres</option>
                        <option value="hectares">Hectares</option>
                    </select>
                </div>
            </div>

            <div class="row">
                <div>
                    <label for="to-unit">To unit</label>
                    <select id="to-unit">
                        <option value="square_meters">Square meters</option>
                        <option value="square_feet">Square feet</option>
                        <option value="square_yards">Square yards</option>
                        <option value="acres">Acres</option>
                        <option value="hectares">Hectares</option>
                    </select>
                </div>
                <div>
                    <label>&nbsp;</label>
                    <div class="actions">
                        <button class="button" type="button" id="convert">Convert</button>
                        <button class="button button--reset" type="button" id="reset">Reset</button>
                    </div>
                </div>
            </div>

            <div class="result" aria-live="polite">
                <p class="result__value" id="output-value">0.00</p>
                <p class="result__label" id="output-label">Select units and convert an area.</p>
                <div class="result__details">
                    <span id="detail-from">From: 0.00 square meters</span>
                    <span id="detail-to">To: 0.00 square meters</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const inputValue = document.getElementById('input-value');
        const fromUnit = document.getElementById('from-unit');
        const toUnit = document.getElementById('to-unit');
        const outputValue = document.getElementById('output-value');
        const outputLabel = document.getElementById('output-label');
        const detailFrom = document.getElementById('detail-from');
        const detailTo = document.getElementById('detail-to');
        const convertButton = document.getElementById('convert');
        const resetButton = document.getElementById('reset');

        function formatNumber(value) {
            return Number(value).toLocaleString('en-US', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 4,
            });
        }

        function toSquareMeters(value, unit) {
            switch (unit) {
                case 'square_meters':
                    return value;
                case 'square_feet':
                    return value * 0.09290304;
                case 'square_yards':
                    return value * 0.83612736;
                case 'acres':
                    return value * 4046.8564224;
                case 'hectares':
                    return value * 10000;
                default:
                    return value;
            }
        }

        function fromSquareMeters(value, unit) {
            switch (unit) {
                case 'square_meters':
                    return value;
                case 'square_feet':
                    return value / 0.09290304;
                case 'square_yards':
                    return value / 0.83612736;
                case 'acres':
                    return value / 4046.8564224;
                case 'hectares':
                    return value / 10000;
                default:
                    return value;
            }
        }

        function unitLabel(unit) {
            switch (unit) {
                case 'square_meters':
                    return 'square meters';
                case 'square_feet':
                    return 'square feet';
                case 'square_yards':
                    return 'square yards';
                case 'acres':
                    return 'acres';
                case 'hectares':
                    return 'hectares';
                default:
                    return unit;
            }
        }

        function convertArea() {
            const input = Number(inputValue.value);
            const from = fromUnit.value;
            const to = toUnit.value;

            if (Number.isNaN(input)) {
                outputValue.textContent = 'Enter a number';
                outputLabel.textContent = 'Please type an area value first.';
                detailFrom.textContent = 'From: �';
                detailTo.textContent = 'To: �';
                return;
            }

            const squareMeters = toSquareMeters(input, from);
            const result = fromSquareMeters(squareMeters, to);

            outputValue.textContent = formatNumber(result);
            outputLabel.textContent = `${formatNumber(input)} ${unitLabel(from)} =`;
            detailFrom.textContent = `From: ${formatNumber(input)} ${unitLabel(from)}`;
            detailTo.textContent = `To: ${formatNumber(result)} ${unitLabel(to)}`;
        }

        function resetConverter() {
            inputValue.value = '';
            fromUnit.value = 'square_meters';
            toUnit.value = 'square_feet';
            outputValue.textContent = '0.00';
            outputLabel.textContent = 'Select units and convert an area.';
            detailFrom.textContent = 'From: 0.00 square meters';
            detailTo.textContent = 'To: 0.00 square meters';
        }

        convertButton.addEventListener('click', convertArea);
        resetButton.addEventListener('click', resetConverter);
        inputValue.addEventListener('keydown', event => {
            if (event.key === 'Enter') {
                convertArea();
            }
        });
    </script>
</body>

</html>
