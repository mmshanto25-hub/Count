<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Volume Converter</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="theme.css">
</head>

<body>
    <div class="container">
        <div class="hero">
            <h1>Volume Converter</h1>
            <p>Convert common volume units like liters, milliliters, gallons, quarts, and pints.</p>
        </div>

        <div class="card">
            <div class="row">
                <div>
                    <label for="input-value">Value</label>
                    <input id="input-value" type="number" step="0.01" placeholder="Enter volume" />
                </div>
                <div>
                    <label for="from-unit">From unit</label>
                    <select id="from-unit">
                        <option value="liters">Liters</option>
                        <option value="milliliters">Milliliters</option>
                        <option value="gallons">Gallons</option>
                        <option value="quarts">Quarts</option>
                        <option value="pints">Pints</option>
                    </select>
                </div>
            </div>

            <div class="row">
                <div>
                    <label for="to-unit">To unit</label>
                    <select id="to-unit">
                        <option value="liters">Liters</option>
                        <option value="milliliters">Milliliters</option>
                        <option value="gallons">Gallons</option>
                        <option value="quarts">Quarts</option>
                        <option value="pints">Pints</option>
                    </select>
                </div>
                <div>
                    <label>&nbsp;</label>
                    <div class="actions">
                        <button class="button" type="button" id="convert">Convert</button>
                        <button class="button button--reset" type="button" id="reset">Reset</button>
                    </div>
                </div>
            </div>

            <div class="result" aria-live="polite">
                <p class="result__value" id="output-value">0.00</p>
                <p class="result__label" id="output-label">Select units and convert a volume.</p>
                <div class="result__details">
                    <span id="detail-from">From: 0.00 liters</span>
                    <span id="detail-to">To: 0.00 liters</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const inputValue = document.getElementById('input-value');
        const fromUnit = document.getElementById('from-unit');
        const toUnit = document.getElementById('to-unit');
        const outputValue = document.getElementById('output-value');
        const outputLabel = document.getElementById('output-label');
        const detailFrom = document.getElementById('detail-from');
        const detailTo = document.getElementById('detail-to');
        const convertButton = document.getElementById('convert');
        const resetButton = document.getElementById('reset');

        function formatNumber(value) {
            return Number(value).toLocaleString('en-US', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 4,
            });
        }

        function toLiters(value, unit) {
            switch (unit) {
                case 'liters':
                    return value;
                case 'milliliters':
                    return value / 1000;
                case 'gallons':
                    return value * 3.785411784;
                case 'quarts':
                    return value * 0.946352946;
                case 'pints':
                    return value * 0.473176473;
                default:
                    return value;
            }
        }

        function fromLiters(value, unit) {
            switch (unit) {
                case 'liters':
                    return value;
                case 'milliliters':
                    return value * 1000;
                case 'gallons':
                    return value / 3.785411784;
                case 'quarts':
                    return value / 0.946352946;
                case 'pints':
                    return value / 0.473176473;
                default:
                    return value;
            }
        }

        function unitLabel(unit) {
            switch (unit) {
                case 'liters':
                    return 'liters';
                case 'milliliters':
                    return 'milliliters';
                case 'gallons':
                    return 'gallons';
                case 'quarts':
                    return 'quarts';
                case 'pints':
                    return 'pints';
                default:
                    return unit;
            }
        }

        function convertVolume() {
            const input = Number(inputValue.value);
            const from = fromUnit.value;
            const to = toUnit.value;

            if (Number.isNaN(input)) {
                outputValue.textContent = 'Enter a number';
                outputLabel.textContent = 'Please type a volume value first.';
                detailFrom.textContent = 'From: �';
                detailTo.textContent = 'To: �';
                return;
            }

            const liters = toLiters(input, from);
            const result = fromLiters(liters, to);

            outputValue.textContent = formatNumber(result);
            outputLabel.textContent = `${formatNumber(input)} ${unitLabel(from)} =`;
            detailFrom.textContent = `From: ${formatNumber(input)} ${unitLabel(from)}`;
            detailTo.textContent = `To: ${formatNumber(result)} ${unitLabel(to)}`;
        }

        function resetConverter() {
            inputValue.value = '';
            fromUnit.value = 'liters';
            toUnit.value = 'milliliters';
            outputValue.textContent = '0.00';
            outputLabel.textContent = 'Select units and convert a volume.';
            detailFrom.textContent = 'From: 0.00 liters';
            detailTo.textContent = 'To: 0.00 liters';
        }

        convertButton.addEventListener('click', convertVolume);
        resetButton.addEventListener('click', resetConverter);
        inputValue.addEventListener('keydown', event => {
            if (event.key === 'Enter') {
                convertVolume();
            }
        });
    </script>
</body>

</html>
