<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Time Converter</title>
    <style>
        :root {
            --bg: #08131f;
            --panel: #101f3b;
            --surface: #16274a;
            --text: #f0f7ff;
            --muted: #8da3c5;
            --accent: #4ec7ff;
            --accent2: #3a8cff;
            --shadow: rgba(0, 0, 0, 0.4);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at top, #1b356c 0%, #08131f 70%);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .container {
            width: min(560px, 100%);
            background: linear-gradient(180deg, #152957 0%, #101f3b 100%);
            border-radius: 28px;
            box-shadow: 0 30px 78px var(--shadow);
            overflow: hidden;
        }

        .hero {
            padding: 28px 32px 20px;
        }

        .hero h1 {
            margin: 0;
            font-size: 2rem;
            letter-spacing: 0.02em;
        }

        .hero p {
            margin: 12px 0 0;
            color: var(--muted);
            font-size: 1rem;
            line-height: 1.55;
        }

        .card {
            background: #111f3b;
            padding: 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: var(--muted);
            font-size: 0.95rem;
        }

        input,
        select {
            width: 100%;
            padding: 16px 14px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: #15264a;
            color: var(--text);
            font-size: 1rem;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: rgba(78, 199, 255, 0.85);
            box-shadow: 0 0 0 4px rgba(78, 199, 255, 0.14);
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            margin-bottom: 18px;
        }

        .button {
            flex: 1 1 150px;
            min-width: 140px;
            border: none;
            border-radius: 18px;
            padding: 16px 24px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            color: var(--text);
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            box-shadow: 0 14px 26px rgba(62, 140, 255, 0.2);
        }

        .button:hover {
            transform: translateY(-1px);
            box-shadow: 0 16px 30px rgba(62, 140, 255, 0.28);
        }

        .button--reset {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text);
            box-shadow: none;
        }

        .result {
            padding: 22px 20px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .result__value {
            margin: 0;
            font-size: 2.8rem;
            letter-spacing: 0.02em;
        }

        .result__label {
            margin: 10px 0 0;
            color: var(--muted);
            font-size: 1rem;
            line-height: 1.5;
        }

        .result__details {
            margin-top: 16px;
            display: grid;
            gap: 10px;
            color: var(--text);
            font-size: 0.98rem;
        }

        .result__details span {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.06);
        }

        @media (max-width: 520px) {
            .row {
                grid-template-columns: 1fr;
            }

            .button {
                flex: 1 1 100%;
            }
        }
    </style>    <link rel="stylesheet" href="theme.css">
</head>
<body>
    <div class="container">
        <div class="hero">
            <h1>Time Converter</h1>
            <p>Convert between seconds, minutes, hours, days, and weeks with instant results.</p>
        </div>

        <div class="card">
            <div class="row">
                <div>
                    <label for="input-value">Value</label>
                    <input id="input-value" type="number" step="0.01" placeholder="Enter time value" />
                </div>
                <div>
                    <label for="from-unit">From unit</label>
                    <select id="from-unit">
                        <option value="seconds">Seconds</option>
                        <option value="minutes">Minutes</option>
                        <option value="hours">Hours</option>
                        <option value="days">Days</option>
                        <option value="weeks">Weeks</option>
                    </select>
                </div>
            </div>

            <div class="row">
                <div>
                    <label for="to-unit">To unit</label>
                    <select id="to-unit">
                        <option value="seconds">Seconds</option>
                        <option value="minutes">Minutes</option>
                        <option value="hours">Hours</option>
                        <option value="days">Days</option>
                        <option value="weeks">Weeks</option>
                    </select>
                </div>
                <div>
                    <label>&nbsp;</label>
                    <div class="actions">
                        <button class="button" type="button" id="convert">Convert</button>
                        <button class="button button--reset" type="button" id="reset">Reset</button>
                    </div>
                </div>
            </div>

            <div class="result" aria-live="polite">
                <p class="result__value" id="output-value">0.00</p>
                <p class="result__label" id="output-label">Select units and convert time.</p>
                <div class="result__details">
                    <span id="detail-from">From: 0.00 seconds</span>
                    <span id="detail-to">To: 0.00 seconds</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const inputValue = document.getElementById('input-value');
        const fromUnit = document.getElementById('from-unit');
        const toUnit = document.getElementById('to-unit');
        const outputValue = document.getElementById('output-value');
        const outputLabel = document.getElementById('output-label');
        const detailFrom = document.getElementById('detail-from');
        const detailTo = document.getElementById('detail-to');
        const convertButton = document.getElementById('convert');
        const resetButton = document.getElementById('reset');

        function formatNumber(value) {
            return Number(value).toLocaleString('en-US', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 4,
            });
        }

        function toSeconds(value, unit) {
            switch (unit) {
                case 'seconds':
                    return value;
                case 'minutes':
                    return value * 60;
                case 'hours':
                    return value * 3600;
                case 'days':
                    return value * 86400;
                case 'weeks':
                    return value * 604800;
                default:
                    return value;
            }
        }

        function fromSeconds(value, unit) {
            switch (unit) {
                case 'seconds':
                    return value;
                case 'minutes':
                    return value / 60;
                case 'hours':
                    return value / 3600;
                case 'days':
                    return value / 86400;
                case 'weeks':
                    return value / 604800;
                default:
                    return value;
            }
        }

        function unitLabel(unit) {
            switch (unit) {
                case 'seconds':
                    return 'seconds';
                case 'minutes':
                    return 'minutes';
                case 'hours':
                    return 'hours';
                case 'days':
                    return 'days';
                case 'weeks':
                    return 'weeks';
                default:
                    return unit;
            }
        }

        function convertTime() {
            const input = Number(inputValue.value);
            const from = fromUnit.value;
            const to = toUnit.value;

            if (Number.isNaN(input)) {
                outputValue.textContent = 'Enter a number';
                outputLabel.textContent = 'Please type a time value first.';
                detailFrom.textContent = 'From: �';
                detailTo.textContent = 'To: �';
                return;
            }

            const seconds = toSeconds(input, from);
            const result = fromSeconds(seconds, to);

            outputValue.textContent = formatNumber(result);
            outputLabel.textContent = `${formatNumber(input)} ${unitLabel(from)} =`;
            detailFrom.textContent = `From: ${formatNumber(input)} ${unitLabel(from)}`;
            detailTo.textContent = `To: ${formatNumber(result)} ${unitLabel(to)}`;
        }

        function resetConverter() {
            inputValue.value = '';
            fromUnit.value = 'seconds';
            toUnit.value = 'minutes';
            outputValue.textContent = '0.00';
            outputLabel.textContent = 'Select units and convert time.';
            detailFrom.textContent = 'From: 0.00 seconds';
            detailTo.textContent = 'To: 0.00 seconds';
        }

        convertButton.addEventListener('click', convertTime);
        resetButton.addEventListener('click', resetConverter);
        inputValue.addEventListener('keydown', event => {
            if (event.key === 'Enter') {
                convertTime();
            }
        });
    </script>
</body>
</html>
