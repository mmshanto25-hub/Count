<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Time Converter</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="theme.css">
</head>

<body>
    <div class="container">
        <div class="hero">
            <h1>Time Converter</h1>
            <p>Convert between seconds, minutes, hours, days, and weeks with instant results.</p>
        </div>

        <div class="card">
            <div class="row">
                <div>
                    <label for="input-value">Value</label>
                    <input id="input-value" type="number" step="0.01" placeholder="Enter time value" />
                </div>
                <div>
                    <label for="from-unit">From unit</label>
                    <select id="from-unit">
                        <option value="seconds">Seconds</option>
                        <option value="minutes">Minutes</option>
                        <option value="hours">Hours</option>
                        <option value="days">Days</option>
                        <option value="weeks">Weeks</option>
                    </select>
                </div>
            </div>

            <div class="row">
                <div>
                    <label for="to-unit">To unit</label>
                    <select id="to-unit">
                        <option value="seconds">Seconds</option>
                        <option value="minutes">Minutes</option>
                        <option value="hours">Hours</option>
                        <option value="days">Days</option>
                        <option value="weeks">Weeks</option>
                    </select>
                </div>
                <div>
                    <label>&nbsp;</label>
                    <div class="actions">
                        <button class="button" type="button" id="convert">Convert</button>
                        <button class="button button--reset" type="button" id="reset">Reset</button>
                    </div>
                </div>
            </div>

            <div class="result" aria-live="polite">
                <p class="result__value" id="output-value">0.00</p>
                <p class="result__label" id="output-label">Select units and convert time.</p>
                <div class="result__details">
                    <span id="detail-from">From: 0.00 seconds</span>
                    <span id="detail-to">To: 0.00 seconds</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const inputValue = document.getElementById('input-value');
        const fromUnit = document.getElementById('from-unit');
        const toUnit = document.getElementById('to-unit');
        const outputValue = document.getElementById('output-value');
        const outputLabel = document.getElementById('output-label');
        const detailFrom = document.getElementById('detail-from');
        const detailTo = document.getElementById('detail-to');
        const convertButton = document.getElementById('convert');
        const resetButton = document.getElementById('reset');

        function formatNumber(value) {
            return Number(value).toLocaleString('en-US', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 4,
            });
        }

        function toSeconds(value, unit) {
            switch (unit) {
                case 'seconds':
                    return value;
                case 'minutes':
                    return value * 60;
                case 'hours':
                    return value * 3600;
                case 'days':
                    return value * 86400;
                case 'weeks':
                    return value * 604800;
                default:
                    return value;
            }
        }

        function fromSeconds(value, unit) {
            switch (unit) {
                case 'seconds':
                    return value;
                case 'minutes':
                    return value / 60;
                case 'hours':
                    return value / 3600;
                case 'days':
                    return value / 86400;
                case 'weeks':
                    return value / 604800;
                default:
                    return value;
            }
        }

        function unitLabel(unit) {
            switch (unit) {
                case 'seconds':
                    return 'seconds';
                case 'minutes':
                    return 'minutes';
                case 'hours':
                    return 'hours';
                case 'days':
                    return 'days';
                case 'weeks':
                    return 'weeks';
                default:
                    return unit;
            }
        }

        function convertTime() {
            const input = Number(inputValue.value);
            const from = fromUnit.value;
            const to = toUnit.value;

            if (Number.isNaN(input)) {
                outputValue.textContent = 'Enter a number';
                outputLabel.textContent = 'Please type a time value first.';
                detailFrom.textContent = 'From: �';
                detailTo.textContent = 'To: �';
                return;
            }

            const seconds = toSeconds(input, from);
            const result = fromSeconds(seconds, to);

            outputValue.textContent = formatNumber(result);
            outputLabel.textContent = `${formatNumber(input)} ${unitLabel(from)} =`;
            detailFrom.textContent = `From: ${formatNumber(input)} ${unitLabel(from)}`;
            detailTo.textContent = `To: ${formatNumber(result)} ${unitLabel(to)}`;
        }

        function resetConverter() {
            inputValue.value = '';
            fromUnit.value = 'seconds';
            toUnit.value = 'minutes';
            outputValue.textContent = '0.00';
            outputLabel.textContent = 'Select units and convert time.';
            detailFrom.textContent = 'From: 0.00 seconds';
            detailTo.textContent = 'To: 0.00 seconds';
        }

        convertButton.addEventListener('click', convertTime);
        resetButton.addEventListener('click', resetConverter);
        inputValue.addEventListener('keydown', event => {
            if (event.key === 'Enter') {
                convertTime();
            }
        });
    </script>
</body>

</html>
